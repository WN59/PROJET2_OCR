<div class="layout">
  @if (titlePage()) {
    <div class="layout__full">
      <app-header [title]="titlePage()" [stats]="stats()" />
    </div>
  }

  @if (loading()) {
    <app-spinner class="layout__full" />
  } @else if (error()) {
    <div class="state layout__full" role="alert">
      <p class="error">{{ error() }}</p>
    </div>
  } @else if (empty()) {
    <p class="state state__empty layout__full">{{ emptyMessage }}</p>
  } @else {
    <section class="layout__chart">
      <app-chart
        type="line"
        [labels]="chartLabels()"
        [data]="chartData()"
        datasetLabel="Medals"
        colors="#047a82"
        caption="Date"
      />
    </section>
  }

  <aside class="layout__aside">
    <a routerLink="/" class="btn" aria-label="Back to dashboard">Back to dashboard</a>
  </aside>
</div>
