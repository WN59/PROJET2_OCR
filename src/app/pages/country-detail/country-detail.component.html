<app-header [title]="titlePage()" [stats]="stats()"></app-header>
<section>
  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  } @else {
    <div class="chart-wrapper">
      @if (chartLabels().length > 0) {
        <app-chart
          type="line"
          [labels]="chartLabels()"
          [data]="chartData()"
          datasetLabel="Medals"
          colors="#0b868f"
          caption="Date"
        />
      }
    </div>
    <p class="back-link">
      <a routerLink="/">Go back</a>
    </p>
  }
</section>
